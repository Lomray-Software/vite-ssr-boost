name: Check PR

on:
  pull_request:
    branches: [prod, staging]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: 22.23.2
  ENABLE_CACHE: yes

jobs:
  browser:
    name: Chromium streaming hydration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  react:
    uses: ./.github/workflows/react-compatibility.yml

  check:
    name: Check PR
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-check
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.ENABLE_CACHE == 'yes' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Commit lint PR title
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint -g commitlint.config.js
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Check eslint
        run: npm run lint:check

      - name: Typescript check
        run: npm run ts:check

      - name: Test
        run: npm run test -- --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage

      - name: Build
        run: |
          npm pkg delete scripts.prepare
          npm run build

      - name: Enforce browser size budgets
        run: npm run test:size

      - name: Boot the built edge package in workerd
        run: npm run test:edge:packed

      - name: Prove public exports (including node/production) and core without optional adapters
        run: npm run test:core:no-optional

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Boot the built Fetch handler on Bun
        run: npm run test:bun

      - uses: actions/checkout@v4
        with:
          path: acceptance/vite-template
          ref: d15557c1d03a16a97521d38432a22cd8fe2b95c3
          repository: Lomray-Software/vite-template

      - name: Install template dependencies
        working-directory: acceptance/vite-template
        run: npm ci --ignore-scripts

      - name: Install Chromium for the template browser checks
        run: npx playwright install --with-deps chromium

      - name: Test template in development and production
        run: node scripts/test-template.mjs acceptance/vite-template
        env:
          SSR_BOOST_TEMPLATE_BROWSER: '1'

      - name: Test template with current runtime dependencies
        run: node scripts/test-template.mjs acceptance/vite-template
        env:
          SSR_BOOST_TEMPLATE_CURRENT: '1'

      - name: Build documentation
        run: npm run docs:build

  sonarcube:
    runs-on: ubuntu-latest
    needs: [check, react, browser]
    concurrency:
      group: ${{ github.ref }}-sonarcube
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage

      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
