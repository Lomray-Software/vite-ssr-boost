name: Release

on:
  push:
    branches: [ prod, staging ]

env:
  NODE_VERSION: 22.21.0
  ENABLE_CACHE: yes

jobs:
  react:
    uses: ./.github/workflows/react-compatibility.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [react]
    concurrency:
      group: ${{ github.ref }}-release
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.ENABLE_CACHE == 'yes' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run check typescript
        run: npm run ts:check

      - name: Run eslint
        run: npm run lint:check

      - name: Test
        run: npm run test -- --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage

      - name: Build
        run: |
          npm pkg delete scripts.prepare
          npm run build

      - name: Boot the built edge package in workerd
        run: npm run test:edge:packed

      - name: Prove core works without optional adapters
        run: npm run test:core:no-optional

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Boot the built Fetch handler on Bun
        run: npm run test:bun

      - uses: actions/checkout@v4
        with:
          path: acceptance/vite-template
          ref: fbbd65524ceb95764bebc39da67af7d9c5737f80
          repository: Lomray-Software/vite-template

      - name: Install template dependencies
        working-directory: acceptance/vite-template
        run: npm ci --ignore-scripts

      - name: Test template in development and production
        run: node scripts/test-template.mjs acceptance/vite-template

      - name: Build documentation
        run: npm run docs:build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  sonarcube:
    runs-on: ubuntu-latest
    needs: [release]
    concurrency:
      group: ${{ github.ref }}-sonarcube
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage

      - id: package-version
        run: npx @lomray/microservices-cli package-version

      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.package-version.outputs.version }}
